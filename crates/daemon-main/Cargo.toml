[package]
name = "daemon-main"
description = "The daemon executable: wires the portable framework to the platform layer"
version.workspace = true
edition.workspace = true
publish.workspace = true

# Binary names must match proto::names::DAEMON_BIN and LAUNCHER_BIN.
[[bin]]
name = "away-guard-daemon"
path = "src/main.rs"

[[bin]]
name = "away-guard-launcher"
path = "src/launcher.rs"

[[bin]]
name = "away-guard-admin"
path = "src/admin.rs"

[dependencies]
daemon.workspace = true
platform.workspace = true
proto.workspace = true
clap.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread"] }

[dev-dependencies]
tempfile.workspace = true
serde_json.workspace = true
