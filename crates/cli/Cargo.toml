[package]
name = "cli"
description = "Command-line client for agents and people; its commands come from the daemon's catalog"
version.workspace = true
edition.workspace = true
publish.workspace = true

# Binary name must match proto::names::CLI_BIN.
[[bin]]
name = "away-guard"
path = "src/main.rs"

[dependencies]
proto.workspace = true
platform.workspace = true
serde_json.workspace = true
clap.workspace = true

[dev-dependencies]
daemon.workspace = true
tempfile.workspace = true
