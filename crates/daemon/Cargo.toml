[package]
name = "daemon"
description = "Portable daemon framework: module interface, registry, events, store, recovery journal, request handling"
version.workspace = true
edition.workspace = true
publish.workspace = true

# Shared and portable: no OS-specific dependency may be added here. OS code lives in
# crates/platform and is handed in through the traits in `sys`, `sqlite` and `transport`.
[dependencies]
proto.workspace = true
agents.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["rt", "io-util", "sync", "macros", "time"] }

[dev-dependencies]
platform.workspace = true
tempfile.workspace = true
