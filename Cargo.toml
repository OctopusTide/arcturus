[workspace]
resolver = "3"
members = ["crates/proto", "crates/daemon", "crates/platform", "crates/daemon-main", "crates/cli", "crates/agents", "crates/agent-hook", "crates/relay"]

[workspace.package]
version = "0.1.0"
edition = "2024"
publish = false

[workspace.dependencies]
proto = { path = "crates/proto" }
daemon = { path = "crates/daemon" }
platform = { path = "crates/platform" }
agents = { path = "crates/agents" }
serde ={ version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4.5", features = ["derive", "env", "string"] }
# Each crate turns on only the tokio features it needs; the shared crates stay portable.
tokio = { version = "1.47", default-features = false }
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_NetworkManagement_IpHelper",
    "Win32_NetworkManagement_Ndis",
    "Win32_NetworkManagement_WiFi",
    "Win32_NetworkManagement_WindowsFilteringPlatform",
    "Win32_System_Rpc",
    "Win32_Networking_WinSock",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Security_Cryptography",
    "Win32_Security_Cryptography_Catalog",
    "Win32_Security_Cryptography_Sip",
    "Win32_Security_WinTrust",
    "Win32_Storage_FileSystem",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_JobObjects",
    "Win32_System_LibraryLoader",
    "Win32_System_Performance",
    "Win32_System_Pipes",
    "Win32_System_Power",
    "Win32_System_ProcessStatus",
    "Win32_System_Registry",
    "Win32_System_Services",
    "Win32_System_RemoteDesktop",
    "Win32_System_Shutdown",
    "Win32_System_SystemInformation",
    "Win32_System_SystemServices",
    "Win32_System_Threading",
    "Win32_System_Time",
    "Win32_UI_WindowsAndMessaging",
] }
# For the few Win32 functions windows-sys does not declare (same macro windows-sys uses).
windows-link = "0.2"
tempfile = "3"
